name: Bug Report
description: Report a problem with the survey system
labels: [bug]
body:
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened? Include error messages if any.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: How can we reproduce this?
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true

  - type: dropdown
    id: deployment-mode
    attributes:
      label: Deployment mode
      description: Which of this repo's deployment approaches were you using?
      options:
        - survey-system-unified (unified, recommended)
        - surveymockup1 / surveymockup1_backend (separate, legacy)
        - Not sure
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Node.js version, browser (if frontend-related)
      placeholder: e.g. Windows 11, Node 22, Chrome 128
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Logs, screenshots, anything else relevant
    validations:
      required: false
