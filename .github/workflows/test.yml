name: Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_DB: survey_system_test
          POSTGRES_PASSWORD: test_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version-file: survey-system-unified/.nvmrc
        cache: npm
        cache-dependency-path: survey-system-unified/package-lock.json

    - name: Install dependencies
      working-directory: survey-system-unified
      run: |
        npm install
        npm run install:all

    - name: Lint
      working-directory: survey-system-unified
      run: npm run lint -- --max-warnings 387

    - name: Initialize test database
      env:
        PGHOST: localhost
        PGUSER: postgres
        PGPASSWORD: test_password
        PGDATABASE: survey_system_test
        PGPORT: 5432
      run: |
        psql < survey-system-unified/server/db/schema/db_template_survey.sql

    - name: Run server tests
      working-directory: survey-system-unified/server
      env:
        NODE_ENV: test
        PG_HOST: localhost
        PG_USER: postgres
        PG_PASSWORD: test_password
        PG_DATABASE: survey_system_test
        PG_PORT: 5432
        SESSION_SECRET: test_secret_key_for_ci_testing_only_0001
        JWT_SECRET: test_secret_key_for_ci_testing_only_0002
        CRYPTO_SECRET: test_secret_key_for_ci_testing_only_0003
        HMAC_SECRET: test_secret_key_for_ci_testing_only_0004
      run: npm test -- --passWithNoTests --bail
      timeout-minutes: 10

    - name: Run client tests
      working-directory: survey-system-unified/client
      run: npm test -- --watchAll=false --passWithNoTests

    - name: Build frontend
      working-directory: survey-system-unified
      run: npm run client:build
      env:
        # GitHub Actions sets CI=true by default for every job. react-scripts
        # treats that as "fail the build on any ESLint warning," which is
        # stricter than the actual Docker production build (no CI var set
        # there) and would fail on this codebase's large pre-existing
        # warning backlog. Override it so this step matches real deploys.
        CI: false

    - name: Upload coverage
      uses: codecov/codecov-action@v7
      if: always()
      with:
        files: ./survey-system-unified/coverage/coverage-final.json
        fail_ci_if_error: false
