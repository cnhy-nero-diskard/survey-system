name: Build Docker Image

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    
    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
      if: github.event_name != 'pull_request'
    
    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v4
      with:
        images: |
          ${{ secrets.DOCKERHUB_USERNAME }}/survey-system
        tags: |
          type=ref,event=branch
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=sha
          type=raw,value=latest,enable={{is_default_branch}}
      if: github.event_name != 'pull_request'
    
    - name: Build and push to Docker Hub
      uses: docker/build-push-action@v4
      with:
        context: ./survey-system-unified
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/survey-system:buildcache
        cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/survey-system:buildcache,mode=max
      if: github.event_name != 'pull_request'
    
    - name: Build image (PR)
      uses: docker/build-push-action@v4
      with:
        context: ./survey-system-unified
        push: false
        load: true
        tags: survey-system:pr
      if: github.event_name == 'pull_request'
    
    - name: Test image (PR)
      if: github.event_name == 'pull_request'
      run: |
        docker run --rm survey-system:pr node --version
        docker run --rm survey-system:pr npm --version
