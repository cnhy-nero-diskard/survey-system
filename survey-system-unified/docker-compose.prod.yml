version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: survey-db-prod
    environment:
      POSTGRES_DB: ${PG_DATABASE}
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
    ports:
      - '5432:5432'
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    networks:
      - survey-network
    restart: unless-stopped

  survey-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: survey-app-prod
    environment:
      NODE_ENV: production
      PORT: 5000
      PG_HOST: postgres
      PG_PORT: 5432
      PG_DATABASE: ${PG_DATABASE}
      PG_USER: ${PG_USER}
      PG_PASSWORD: ${PG_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      CRYPTO_SECRET: ${CRYPTO_SECRET}
      HMAC_SECRET: ${HMAC_SECRET}
      SESSION_SECRET: ${SESSION_SECRET}
    ports:
      - '5000:5000'
    depends_on:
      - postgres
    networks:
      - survey-network
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "const http = require('http'); const options = { host: 'localhost', port: 5000, path: '/api/health' }; const req = http.request(options, (res) => { if (res.statusCode === 200) process.exit(0); else process.exit(1); }); req.on('error', () => process.exit(1)); req.end();",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  postgres_prod_data:

networks:
  survey-network:
    driver: bridge
